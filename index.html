<div class="container-fluid py-3 px-2 px-sm-3 px-md-4">
  <div class="row justify-content-center g-0">

    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 px-0">

      <div class="card shadow-sm">
        <div class="card-body">

      <h3 class="card-title">推し発狂ジェネレーター</h3>
      <h6 class="card-subtitle mb-4 text-body-secondary">推しへの愛を叫ぼう</h6>

      <!-- 繰り返し文字 -->
      <div class="mb-4">
        <label class="form-label">繰り返す文字</label>

        <div class="input-group">
          <input id="repeatText" class="form-control">
          <button class="btn btn-outline-secondary btn-clear" type="button" id="clearRepeat">×</button>
        </div>
        <div class="form-text">
          <div class="row align-items-center">
              <div class="col">推しの名前など</div>
              <div class="col-auto text-end">
                  <span id="repeatCount" class="badge bg-secondary">0 / 140</span>
              </div>
          </div>
        </div>

        <div class="form-check form-switch mt-3">
          <input class="form-check-input" type="checkbox" role="switch" id="boostMode">
          <label class="form-check-label" for="boostMode">ブーストモード</label>
        </div>
        <div class="form-text mb-2">
          指定した回数だけ文字を繰り返します。<br>
          140文字を超える長文も生成できます。
        </div>
        <div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label mb-0" for="boostRange">繰り返し回数</label>
            <span id="boostRangeValue" class="badge bg-secondary">10回</span>
          </div>
          <input type="range" class="form-range" id="boostRange" min="1" max="1000" step="1" value="10" disabled>
        </div>
      </div>

      <!-- ハッシュタグ -->
      <div class="mb-4">
        <label class="form-label">ハッシュタグなど</label>

        <div class="input-group">
          <input id="suffixText" class="form-control">
          <button class="btn btn-outline-secondary btn-clear" type="button" id="clearSuffix">×</button>
        </div>
        <div class="form-text">
          <div class="row align-items-center">
              <div class="col">未入力でも問題ありません</div>
              <div class="col-auto text-end">
                  <span id="suffixCount" class="badge bg-secondary">0 / 140</span>
              </div>
          </div>
        </div>
      </div>

      <!-- ハッシュチェックボックス -->
      <div class="mb-4">
        <label class="form-label">よく使うハッシュタグ</label>
        <div class="accordion" id="hashtagAccordion"></div>
      </div>

      <!-- 結果 -->
      <div class="mb-3">
        <label class="form-label">生成結果</label>
        <textarea id="resultText" class="form-control" rows="7" readonly placeholder="ここをタップするとコピーできます"></textarea>
          <div class="form-text text-end">
            <span id="finalCount" class="badge bg-secondary">0 / 140</span>
          </div>
      </div>

      <!-- ボタン -->
      <button id="postButton" class="btn btn-outline-primary w-100 btn-lg mb-3" disabled>
        Xに投稿する
      </button>

      <!-- フッター -->
      <div class="d-flex align-items-center text-muted small gap-1 related-link">
        <i class="bi bi-link-45deg"></i>
        <a href="https://airmiya7.github.io/xpostgen/maika/" target="_blank" class="link-secondary text-decoration-none">
          マイカ構文ジェネレーター
        </a>
      </div>
      <div class="text-end text-muted small">
          ver. 0.217
          ©<a href="https://x.com/airmiya" target="_blank" class="link-secondary text-decoration-none">airmiya</a>
      </div>
    </div>
  </div>
</div>

<script>
const LIMIT = 140;
const BOOST_MIN = 1;
const BOOST_MAX = 10000;
const BOOST_DEFAULT = 10;

const repeatText = document.getElementById("repeatText");
const suffixText = document.getElementById("suffixText");
const resultText = document.getElementById("resultText");
const boostMode = document.getElementById("boostMode");
const boostRange = document.getElementById("boostRange");
const boostRangeValue = document.getElementById("boostRangeValue");

const repeatCount = document.getElementById("repeatCount");
const suffixCount = document.getElementById("suffixCount");
const finalCount = document.getElementById("finalCount");

const clearRepeat = document.getElementById("clearRepeat");
const clearSuffix = document.getElementById("clearSuffix");
const postButton = document.getElementById("postButton");

let hashtagChecks;

// ハッシュタグプリセット
// ここに追加するだけでチェックボックスが自動生成される
const hashtagGroups = [
  {
    title: "基本タグ",
    icon: "bi-tags",
    open: true,
    tags: [
      { text: "#蓮ノ空" },
      { text: "#リンクラ" },
      { text: "#lovelive" }
    ]
  },
  {
    title: "映画タグ",
    icon: "bi-film",
    open: true,
    tags: [
      { text: "#映画蓮ノ空" },
      { text: "#映画蓮ノ空感想" }
    ]
  },
  {
    title: "6th Liveタグ",
    icon: "bi-bank",
    open: false,
    tags: [
      { text: "#蓮ノ空6th福岡Day1" },
      { text: "#蓮ノ空6th福岡Day2" },
      { text: "#蓮ノ空6th兵庫Day1" },
      { text: "#蓮ノ空6th兵庫Day2" },
      { text: "#蓮ノ空6th神奈川Day1" },
      { text: "#蓮ノ空6th神奈川Day2" },
      { text: "#蓮ノ空6th埼玉Day1" },
      { text: "#蓮ノ空6th埼玉Day2" },
    ]
  },
  {
    title: "ジェネレータータグ",
    icon: "bi-chat-heart",
    open: false,
    tags: [
      { text: "#推し発狂ジェネレーター", checked: true }
    ]
  }
];

// ハッシュタグ選択
function renderHashtagChecks() {
  const accordion =
    document.getElementById("hashtagAccordion");

  accordion.innerHTML = "";

  let tagIndex = 1;

  hashtagGroups.forEach((group, groupIndex) => {
    const collapseId =
      "hashtagCollapse" + (groupIndex + 1);

    const headingId =
      "hashtagHeading" + (groupIndex + 1);

    const item =
      document.createElement("div");

    item.className = "accordion-item";

    item.innerHTML = `
      <h2 class="accordion-header"
          id="${headingId}">

        <button
          class="accordion-button ${
            group.open
              ? ""
              : "collapsed"
          }"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#${collapseId}"
          aria-expanded="${
            group.open
              ? "true"
              : "false"
          }"
          aria-controls="${collapseId}"
        >

          <span class="d-flex align-items-center gap-2">
            <i class="bi ${group.icon}"></i>
            <span>${group.title}</span>
          </span>

        </button>
      </h2>

      <div
        id="${collapseId}"
        class="accordion-collapse collapse ${
          group.open
            ? "show"
            : ""
        }"
      >
        <div class="accordion-body">
          <div
            class="d-flex flex-wrap gap-2"
            data-tag-container
          ></div>
        </div>
      </div>
    `;

    const tagContainer =
      item.querySelector("[data-tag-container]");

    group.tags.forEach(tag => {
      const id = "tag" + tagIndex;
      tagIndex++;

      const wrapper =
        document.createElement("div");

      wrapper.className = "form-check";

      const input =
        document.createElement("input");

      input.className =
        "form-check-input hashtag-check";

      input.type = "checkbox";
      input.value = tag.text;
      input.id = id;
      input.checked = !!tag.checked;

      const label =
        document.createElement("label");

      label.className = "form-check-label";
      label.htmlFor = id;
      label.textContent = tag.text;

      wrapper.appendChild(input);
      wrapper.appendChild(label);
      tagContainer.appendChild(wrapper);
    });

    accordion.appendChild(item);
  });

  hashtagChecks =
    document.querySelectorAll(".hashtag-check");

  hashtagChecks.forEach(cb => {
    cb.addEventListener("change", updateSuffixFromCheckbox);
});
}

// 文字数カウントと色設定
function getBadgeClass(length, limit) {
  if (length >= limit) return "badge bg-danger";
  if (length > limit * 0.85) return "badge bg-warning text-dark";
  return "badge bg-secondary";
}

// 文字数カウント
function updateCounts() {
  const suffix = suffixText.value.trim();
  const suffixPart = suffix ? " " + suffix : "";
  const repeatLimit = Math.max(LIMIT - suffixPart.length, 0);

  if (boostMode.checked) {
    repeatText.maxLength = 1000;
    repeatCount.textContent = `${repeatText.value.length}文字`;
    repeatCount.className = "badge bg-secondary";
  } else {
    repeatText.maxLength = repeatLimit;
    repeatCount.textContent = `${repeatText.value.length} / ${repeatLimit}`;
    repeatCount.className = getBadgeClass(repeatText.value.length, repeatLimit);
  }

  suffixCount.textContent = `${suffix.length} / ${LIMIT}`;
  suffixCount.className = getBadgeClass(suffix.length, LIMIT);
}

// 投稿文生成
function generatePost() {
  updateCounts();

  const repeat = repeatText.value;
  const suffix = suffixText.value.trim();
  const suffixPart = suffix ? " " + suffix : "";
  const maxRepeatLength = LIMIT - suffixPart.length;

  if (boostMode.checked) {
    const boostCount = Number(boostRange.value);
    const body = repeat.repeat(boostCount);
    resultText.value = body + (body ? suffixPart : suffix);
  } else if (!repeat) {
    resultText.value = suffix;
  } else {
    let repeated = "";

    while ((repeated + repeat).length <= maxRepeatLength) {
      repeated += repeat;
    }

    resultText.value = repeated + suffixPart;
  }

  const resultLength = Array.from(resultText.value).length;
  finalCount.textContent = boostMode.checked
    ? `${resultLength.toLocaleString()}文字`
    : `${resultLength} / ${LIMIT}`;
  finalCount.className = boostMode.checked
    ? "badge bg-secondary"
    : getBadgeClass(resultLength, LIMIT);

  updatePostButtonState();
}

// チェックボックスで選択したハッシュタグをsuffixTextに反映
function updateSuffixFromCheckbox() {
  const checkedTags = Array.from(hashtagChecks)
    .filter(cb => cb.checked)
    .map(cb => cb.value);

  const allPresetTags = Array.from(hashtagChecks).map(cb => cb.value);

  const currentTags = suffixText.value
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  const manualTags = currentTags.filter(tag => !allPresetTags.includes(tag));
  const mergedTags = [...manualTags, ...checkedTags];

  suffixText.value = mergedTags.join(" ");

  generatePost();
}

// Xに投稿する
function postToX() {
  const resultLength = Array.from(resultText.value).length;
  if (resultLength > LIMIT) {
    const shouldContinue = window.confirm(
      "生成結果は140文字を超えています。\n\n" +
      "X Premiumなど、長文投稿に対応したアカウントで利用してください。\n" +
      "通常アカウントでは投稿できない場合があります。\n\n" +
      "このままXを開きますか？"
    );
    if (!shouldContinue) return;
  }

  const text = encodeURIComponent(resultText.value);
  const url = `https://twitter.com/intent/tweet?text=${text}`;
  window.open(url, "_blank", "noopener,noreferrer");
}

// 生成結果がない場合は投稿させない
function updatePostButtonState() {
  if (!resultText.value) {
    postButton.disabled = true;
  } else {
    postButton.disabled = false;
  }
}

// ボタンアクション
repeatText.addEventListener("input", generatePost);
suffixText.addEventListener("input", generatePost);
boostMode.addEventListener("change", () => {
  boostRange.disabled = !boostMode.checked;
  generatePost();
});
boostRange.addEventListener("input", () => {
  boostRangeValue.textContent = `${boostRange.value}回`;
  generatePost();
});

clearRepeat.addEventListener("click", () => {
  repeatText.value = "";
  generatePost();
});

clearSuffix.addEventListener("click", () => {
  suffixText.value = "";
  hashtagChecks.forEach(cb => cb.checked = false);
  generatePost();
});

resultText.addEventListener("click", async () => {
  if (!resultText.value) return;

  try {
    await navigator.clipboard.writeText(resultText.value);
    resultText.classList.add("is-valid");

    setTimeout(() => {
      resultText.classList.remove("is-valid");
    }, 1000);
  } catch (error) {
    alert("コピーに失敗しました");
  }
});

postButton.addEventListener("click", postToX);

// 初期化
boostRange.min = BOOST_MIN;
boostRange.max = BOOST_MAX;
boostRange.value = BOOST_DEFAULT;
boostRangeValue.textContent = `${BOOST_DEFAULT}回`;
boostRange.disabled = true;
renderHashtagChecks();
updateSuffixFromCheckbox();
</script>

</body>
