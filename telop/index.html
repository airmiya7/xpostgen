<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fa" />
    <title>活動記録テロップメーカー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" rel="stylesheet" />
    <style>
      body { min-width: 320px; background: #f8f9fa; color: #212529; }
      .app-header { max-width: 760px; }
      .canvas-wrap { display: grid; min-height: 340px; place-items: center; overflow: hidden; border: 2px dashed #ced4da; border-radius: .5rem; background: #f8f9fa; }
      canvas { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; }
      .empty-message { color: #6c757d; text-align: center; }
      .privacy-note { color: #6c757d; font-size: .875rem; }
      .crop-stage { height: min(65vh, 560px); background: #212529; }
      .crop-stage img { display: block; max-width: 100%; }
      @media (max-width: 767.98px) { .canvas-wrap { min-height: 240px; } }
    </style>
  </head>
  <body>
    <main class="container py-4 py-md-5">
      <header class="app-header mb-4">
        <h1 class="h2 mb-2">活動記録テロップメーカー</h1>
        <p class="text-secondary mb-0">写真に活動記録風のテロップを合成し、PNGで保存できます。</p>
      </header>

      <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-4">
          <section class="card shadow-sm" aria-labelledby="settings-title">
            <div class="card-body p-4">
              <h2 id="settings-title" class="h5 mb-4">テロップを設定</h2>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="image-input">画像</label>
                <input id="image-input" class="form-control" type="file" accept="image/*" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="speaker-input">話者 <span class="fw-normal text-secondary small">例：花帆</span></label>
                <input id="speaker-input" class="form-control" type="text" maxlength="40" placeholder="花帆" autocomplete="off" />
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold" for="dialogue-input">セリフ <span class="fw-normal text-secondary small">改行可・長文は自動で折り返します</span></label>
                <textarea id="dialogue-input" class="form-control" rows="5" maxlength="500" placeholder="今日の活動記録です！"></textarea>
              </div>
              <div class="d-grid gap-2">
                <button id="download-button" class="btn btn-primary" type="button" disabled>PNGを保存</button>
                <button id="share-button" class="btn btn-outline-secondary" type="button" disabled>Xで共有</button>
              </div>
              <p id="status" class="small text-primary mt-3 mb-0" role="status" aria-live="polite"></p>
              <p class="privacy-note mt-3 mb-0">画像はブラウザ内でのみ処理され、サーバーへ送信・保存されません。</p>
            </div>
          </section>
        </div>

        <div class="col-12 col-lg-8">
          <section class="card shadow-sm" aria-labelledby="preview-title">
            <div class="card-body p-3 p-md-4">
              <h2 id="preview-title" class="h5 mb-3">プレビュー</h2>
              <div class="canvas-wrap">
                <p id="empty-message" class="empty-message mb-0 p-4">画像を選ぶと、ここにプレビューが表示されます。</p>
                <canvas id="canvas" hidden aria-label="テロップ付き画像のプレビュー"></canvas>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div id="crop-modal" class="modal fade" tabindex="-1" aria-labelledby="crop-modal-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="crop-modal-title" class="modal-title fs-5">画像をトリミング</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
          </div>
          <div class="modal-body">
            <p class="small text-secondary">画像をドラッグして位置を調整できます。ホイールまたはピンチ操作で拡大・縮小できます。</p>
            <div class="crop-stage">
              <img id="crop-image" alt="トリミングする画像" />
            </div>
            <div class="mt-3" aria-label="アスペクト比">
              <span class="small fw-semibold me-2">アスペクト比</span>
              <div class="btn-group btn-group-sm" role="group">
                <button type="button" class="btn btn-primary" data-aspect-ratio="16:9" aria-pressed="true">16:9</button>
                <button type="button" class="btn btn-outline-primary" data-aspect-ratio="9:16" aria-pressed="false">9:16</button>
              </div>
            </div>
          </div>
          <div class="modal-footer flex-column flex-sm-row">
            <button id="crop-cancel-button" type="button" class="btn btn-outline-secondary w-100 w-sm-auto">キャンセル</button>
            <button id="original-image-button" type="button" class="btn btn-outline-primary w-100 w-sm-auto">元画像のまま続行</button>
            <button id="apply-crop-button" type="button" class="btn btn-primary w-100 w-sm-auto">適用</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <script>
      (() => {
        const imageInput = document.querySelector('#image-input');
        const speakerInput = document.querySelector('#speaker-input');
        const dialogueInput = document.querySelector('#dialogue-input');
        const canvas = document.querySelector('#canvas');
        const emptyMessage = document.querySelector('#empty-message');
        const downloadButton = document.querySelector('#download-button');
        const shareButton = document.querySelector('#share-button');
        const status = document.querySelector('#status');
        const cropModalElement = document.querySelector('#crop-modal');
        const cropImage = document.querySelector('#crop-image');
        const cropCancelButton = document.querySelector('#crop-cancel-button');
        const originalImageButton = document.querySelector('#original-image-button');
        const applyCropButton = document.querySelector('#apply-crop-button');
        const aspectButtons = document.querySelectorAll('[data-aspect-ratio]');
        const ctx = canvas.getContext('2d');
        const cropModal = new bootstrap.Modal(cropModalElement);
        let sourceImage = null;
        let originalImage = null;
        let cropper = null;
        let cropImageLoaded = false;
        let cropAccepted = false;

        // Photoshopで1920×1080素材から実測した活動記録のレイアウト定数。
        const REFERENCE_WIDTH = 1920;
        const REFERENCE_HEIGHT = 1080;
        const DIALOGUE_FONT_PIXELS = 50;
        const SPEAKER_FONT_PIXELS = 40;
        const DIALOGUE_LAST_BASELINE_PIXELS = 156;
        const SPEAKER_BASELINE_PIXELS = 68;
        const DIALOGUE_CENTER_OFFSET_PIXELS = 6;
        const SPEAKER_CENTER_OFFSET_PIXELS = 3;
        const DIALOGUE_FONT_RATIO = DIALOGUE_FONT_PIXELS / REFERENCE_HEIGHT;
        const SPEAKER_FONT_RATIO = SPEAKER_FONT_PIXELS / REFERENCE_HEIGHT;
        const DIALOGUE_LAST_BASELINE_RATIO = DIALOGUE_LAST_BASELINE_PIXELS / REFERENCE_HEIGHT;
        const SPEAKER_BASELINE_RATIO = SPEAKER_BASELINE_PIXELS / REFERENCE_HEIGHT;
        const DIALOGUE_CENTER_OFFSET_RATIO = DIALOGUE_CENTER_OFFSET_PIXELS / REFERENCE_WIDTH;
        const SPEAKER_CENTER_OFFSET_RATIO = SPEAKER_CENTER_OFFSET_PIXELS / REFERENCE_WIDTH;
        const TRACKING_RATIO = 38 / 1000;
        const LINE_HEIGHT_RATIO = 62 / 50;

        function setStatus(message) { status.textContent = message; }

        function setTextStyle(fontSize) {
          ctx.font = `600 ${fontSize}px "Klee One", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#000000';
          // strokeText() は中心線を基準に描かれ、後続の白塗りで内側半分が覆われる。
          // 4pxのストロークにより、見た目の外側縁を約2pxにする。
          ctx.lineWidth = 4;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.miterLimit = 2;
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }

        function trackedWidth(text, tracking) {
          return ctx.measureText(text).width + Math.max(0, text.length - 1) * tracking;
        }

        function drawTrackedText(text, x, y, tracking) {
          const width = trackedWidth(text, tracking);
          let characterX = x - width / 2;
          for (const character of text) {
            const characterWidth = ctx.measureText(character).width;
            const glyphCenterX = characterX + characterWidth / 2;
            ctx.strokeText(character, glyphCenterX, y);
            ctx.fillText(character, glyphCenterX, y);
            characterX += characterWidth + tracking;
          }
        }

        function wrapText(text, maxWidth, tracking) {
          const lines = [];
          for (const paragraph of text.replace(/\r\n?/g, '\n').split('\n')) {
            if (!paragraph) { lines.push(''); continue; }
            let line = '';
            for (const character of paragraph) {
              const candidate = line + character;
              if (line && trackedWidth(candidate, tracking) > maxWidth) {
                lines.push(line);
                line = character;
              } else {
                line = candidate;
              }
            }
            lines.push(line);
          }
          return lines;
        }

        function draw() {
          if (!sourceImage) return;
          const width = sourceImage.naturalWidth;
          const height = sourceImage.naturalHeight;
          canvas.width = width;
          canvas.height = height;
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(sourceImage, 0, 0, width, height);

          const dialogue = dialogueInput.value.trim();
          const speaker = speakerInput.value.trim();
          const dialogueCenterX = width / 2 - width * DIALOGUE_CENTER_OFFSET_RATIO;
          const speakerCenterX = width / 2 - width * SPEAKER_CENTER_OFFSET_RATIO;

          // セリフを先に描画し、最後の行は常に下端から14.074%の位置に固定する。
          if (dialogue) {
            const dialogueSize = height * DIALOGUE_FONT_RATIO;
            const tracking = dialogueSize * TRACKING_RATIO;
            const lineHeight = dialogueSize * LINE_HEIGHT_RATIO;
            setTextStyle(dialogueSize);
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            const lines = wrapText(dialogue, width * (9 / 10), tracking);
            const lastBaseline = height - height * DIALOGUE_LAST_BASELINE_RATIO;
            lines.forEach((line, index) => {
              if (line) drawTrackedText(line, dialogueCenterX, lastBaseline - (lines.length - 1 - index) * lineHeight, tracking);
            });
          }

          // 話者はセリフの上ではなく、指定された下端基準の固定位置に描画する。
          if (speaker) {
            const speakerSize = height * SPEAKER_FONT_RATIO;
            setTextStyle(speakerSize);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            drawTrackedText(`[${speaker}]`, speakerCenterX, height - height * SPEAKER_BASELINE_RATIO, 0);
          }
        }

        function useImage(image) {
          sourceImage = image;
          emptyMessage.hidden = true;
          canvas.hidden = false;
          downloadButton.disabled = false;
          shareButton.disabled = false;
          setStatus('');
          const fontSize = image.naturalHeight * DIALOGUE_FONT_RATIO;
          const fontReady = document.fonts ? document.fonts.load(`600 ${fontSize}px "Klee One"`) : Promise.resolve();
          fontReady.then(draw, draw);
        }

        function ratioFromButton(button) {
          const [width, height] = button.dataset.aspectRatio.split(':').map(Number);
          return width / height;
        }

        function activateAspectButton(activeButton) {
          aspectButtons.forEach(button => {
            const active = button === activeButton;
            button.classList.toggle('btn-primary', active);
            button.classList.toggle('btn-outline-primary', !active);
            button.setAttribute('aria-pressed', String(active));
          });
        }

        function createCropper() {
          if (!cropImageLoaded || !originalImage) return;
          if (cropper) cropper.destroy();
          const activeButton = document.querySelector('[data-aspect-ratio][aria-pressed="true"]');
          cropper = new Cropper(cropImage, {
            aspectRatio: ratioFromButton(activeButton),
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 1,
            responsive: true,
            background: false,
            movable: true,
            zoomable: true,
            zoomOnWheel: true,
            zoomOnTouch: true,
            toggleDragModeOnDblclick: false,
          });
        }

        imageInput.addEventListener('change', () => {
          const [file] = imageInput.files;
          if (!file) return;
          if (!file.type.startsWith('image/')) { setStatus('画像ファイルを選択してください。'); return; }
          const reader = new FileReader();
          reader.onload = () => {
            const image = new Image();
            image.onload = () => {
              originalImage = image;
              cropAccepted = false;
              cropImageLoaded = false;
              activateAspectButton(aspectButtons[0]);
              cropImage.src = reader.result;
              cropModal.show();
            };
            image.onerror = () => setStatus('この画像は読み込めませんでした。');
            image.src = reader.result;
          };
          reader.readAsDataURL(file);
        });

        cropImage.addEventListener('load', () => {
          cropImageLoaded = true;
          if (cropModalElement.classList.contains('show')) createCropper();
        });

        cropModalElement.addEventListener('shown.bs.modal', createCropper);
        cropModalElement.addEventListener('hidden.bs.modal', () => {
          if (cropper) { cropper.destroy(); cropper = null; }
          cropImageLoaded = false;
          if (!cropAccepted) imageInput.value = '';
          originalImage = null;
        });

        aspectButtons.forEach(button => button.addEventListener('click', () => {
          activateAspectButton(button);
          if (cropper) cropper.setAspectRatio(ratioFromButton(button));
        }));

        cropCancelButton.addEventListener('click', () => cropModal.hide());

        originalImageButton.addEventListener('click', () => {
          if (!originalImage) return;
          cropAccepted = true;
          useImage(originalImage);
          cropModal.hide();
        });

        applyCropButton.addEventListener('click', () => {
          if (!cropper) return;
          const croppedCanvas = cropper.getCroppedCanvas({ imageSmoothingEnabled: true, imageSmoothingQuality: 'high' });
          if (!croppedCanvas) { setStatus('画像の切り出しに失敗しました。'); return; }
          const croppedImage = new Image();
          croppedImage.onload = () => {
            cropAccepted = true;
            useImage(croppedImage);
            cropModal.hide();
          };
          croppedImage.onerror = () => setStatus('切り出した画像を読み込めませんでした。');
          croppedImage.src = croppedCanvas.toDataURL('image/png');
        });

        [speakerInput, dialogueInput].forEach(input => input.addEventListener('input', draw));

        function exportBlob() { return new Promise(resolve => canvas.toBlob(resolve, 'image/png')); }

        downloadButton.addEventListener('click', async () => {
          if (!sourceImage) return;
          const blob = await exportBlob();
          if (!blob) { setStatus('PNGの作成に失敗しました。'); return; }
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'katsudo-kiroku-telop.png';
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          setStatus('PNGを保存しました。');
        });

        shareButton.addEventListener('click', async () => {
          if (!sourceImage) return;
          const speaker = speakerInput.value.trim();
          const dialogue = dialogueInput.value.trim();
          const text = [speaker && `[${speaker}]`, dialogue].filter(Boolean).join('\n') || '活動記録を作成しました！';
          const blob = await exportBlob();
          const file = blob && new File([blob], 'katsudo-kiroku-telop.png', { type: 'image/png' });
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            try { await navigator.share({ text, files: [file] }); return; } catch (error) { if (error.name === 'AbortError') return; }
          }
          window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
          setStatus('Xの投稿画面を開きました。画像はPNG保存後に添付してください。');
        });
      })();
    </script>
  </body>
</html>
